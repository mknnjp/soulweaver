[package]
name = "remote-git-graph"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio"] }
iced_graphics = "0.13"
russh = "0.45"
russh-keys = "0.45"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
